<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet" />
    <title>ジャジバ - 観光専用SNS</title>
    <meta
      name="description"
      content="自治体・企業だけが発信する観光専用SNS。写真・動画で地方の「見たことない」「行ってみたい」を発見し、アクセス・宿・飲食店の情報からしおり作りまで、旅の準備をひとつに。"
    />
    <!-- Link previews (LINE, X, Facebook, Slack...). Absolute URLs are required
         here; jaziba.jp is the production custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ジャジバ（Jaziba）" />
    <meta property="og:title" content="ジャジバ - 観光専用SNS" />
    <meta
      property="og:description"
      content="自治体・企業だけが発信する観光専用SNS。地方の「見たことない」「行ってみたい」を発見して、旅の準備まで。"
    />
    <meta property="og:url" content="https://jaziba.jp/" />
    <meta property="og:image" content="https://jaziba.jp/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Splash shown immediately from static HTML, before the JS bundle loads
         or executes — matters most on the free-tier backend's cold starts.
         React's createRoot(...).render() replaces #root's contents wholesale
         once it mounts, so this needs no manual removal/cleanup. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
      }
      #splash img {
        width: 200px;
        height: auto;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <img src="/brand/jaziba-logo.png" alt="Jaziba" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
