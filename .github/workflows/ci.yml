name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Frontend — install, lint, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # Backend API tests also serve the built frontend, so build it first.
      - name: Backend — install, typecheck, test, build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test
          npm run build
