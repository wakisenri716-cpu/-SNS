services:
  - type: web
    name: tabitube
    env: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPEN_METEO_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
